# Fixed scenarios for the planner prompt. Each `context` is exactly the JSON
# the app sends the model (see lib/planner/context.ts).
#
# Quest names here are invented fixtures, not real game data; zone and inn
# names match supabase/seed.sql. Optional `expect` adds checks:
#   no_quests: true        the plan must not name any quest
#   forbid_ids: [...]      these candidate ids must not be used
#   must_not_mention: [...] text that must not appear anywhere in the plan
#   require_ids: [...]     these candidate ids must be used (the group's dungeon)
#   must_mention: [...]    text that must appear somewhere in the plan
#
# Group scenarios carry `group` exactly as lib/planner/group.ts computes it:
# roles and the dungeon are decided in code before the model sees them.

- id: elwynn-xp-60
  about: A typical evening with plenty of nearby quests
  context: &elwynn
    character: { class: warrior, race: human, level: 6, faction: alliance, zone: Elwynn Forest }
    minutes: 60
    goal: xp
    candidates:
      - { id: q-e1, name: The Lost Satchel, zone: Elwynn Forest, levels: [5, 7], estMinutes: 15 }
      - { id: q-e2, name: Wolves at the Fence, zone: Elwynn Forest, levels: [5, 8], estMinutes: 20 }
      - {
          id: q-e3,
          name: Candles for the Chapel,
          zone: Elwynn Forest,
          levels: [6, 8],
          estMinutes: 10,
        }
      - { id: q-e4, name: Trouble in the Mine, zone: Elwynn Forest, levels: [7, 9], estMinutes: 25 }
      - {
          id: q-e5,
          name: Letters to the Watch,
          zone: Elwynn Forest,
          levels: [4, 6],
          estMinutes: 10,
        }
    restSpots:
      - { id: goldshire-inn, name: "Lion's Pride Inn, Goldshire", zone: Elwynn Forest }
      - { id: stormwind-city, name: Stormwind City, zone: Stormwind City }

