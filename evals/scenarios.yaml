- id: group-dungeon-120
  about: A full group with a tank and healer, and a dungeon that fits
  context:
    character: { class: paladin, race: human, level: 20, faction: alliance, zone: Westfall }
    minutes: 120
    goal: dungeon
    candidates:
      - {
          id: d-w1,
          name: The Flooded Deeps,
          zone: Westfall,
          levels: [18, 23],
          kind: dungeon,
          estMinutes: 60,
        }
      - {
          id: q-w1,
          name: Deeps Recon,
          zone: Westfall,
          levels: [18, 21],
          estMinutes: 10,
          notes: "Completed inside The Flooded Deeps",
        }
      - { id: q-w2, name: Scarecrow Season, zone: Westfall, levels: [17, 20], estMinutes: 20 }
    restSpots:
      - { id: stormwind-city, name: Stormwind City, zone: Stormwind City }
      - { id: lakeshire-inn, name: Lakeshire Inn, zone: Redridge Mountains }
    group:
      members:
        - { class: paladin, level: 20, role: healer }
        - { class: warrior, level: 21, role: tank }
        - { class: mage, level: 19, role: dps }
        - { class: rogue, level: 20, role: dps }
        - { class: hunter, level: 22, role: dps }
      dungeon: { id: d-w1, name: The Flooded Deeps, zone: Westfall, estMinutes: 60 }
  expect: { require_ids: [d-w1], must_mention: [warrior] }

