<!--
  Supabase magic link email. Paste into Supabase > Authentication > Emails >
  Templates > Magic Link (subject: "Your sign-in link for Classic WoW Forever").

  The link uses token_hash rather than {{ .ConfirmationURL }} so it works even
  when the email is opened on a different device than the one that asked for
  it (sign in on the desktop, open the email on a phone). app/auth/confirm
  (Milestone 2) verifies the hash on the server and sets the session cookie.

  Email clients ignore stylesheets and CSS variables, so colors are inlined
  here from the dark palette in lib/theme.ts. Keep them in sync by hand.
-->
<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#14110F;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#14110F;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#1E1A16;border:1px solid #3A322A;border-radius:8px;">
            <tr>
              <td style="padding:32px 32px 8px;font-family:Georgia,'Times New Roman',serif;font-size:14px;letter-spacing:3px;color:#D4A84B;text-transform:uppercase;">
                Classic WoW Forever
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 0;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:22px;line-height:1.3;color:#EDE3CF;">
                Your sign-in link
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 24px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;color:#B3A68C;">
                Tap the button to sign in. The link works once and expires in an hour.
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 32px;">
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;next=/characters"
                   style="display:inline-block;background:#D4A84B;color:#14110F;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;font-weight:600;text-decoration:none;padding:12px 24px;border-radius:8px;">
                  Sign in
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 32px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.5;color:#B3A68C;">
                Didn't ask for this? You can ignore this email; nobody can sign in without the link.
              </td>
            </tr>
          </table>
          <p style="margin:24px 0 0;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;color:#B3A68C;">
            Fan site, not affiliated with Blizzard Entertainment.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
